// SPDX-License-Identifier: Apache-2.0
//
// Shared types for the grpc-markup collector: the format vocabulary, the
// typed events that make up the response stream, and the trailer that closes
// it.
//
// The collector maps lightweight text markup — Markdown, HTML, AsciiDoc,
// LaTeX, WebVTT, BoxNote and serialized Docling JSON — into one block
// vocabulary. Every format lands on the same events, so a downstream reader
// handles a heading the same way whether it was `# Title`, `<h1>`, `= Title`
// or `\section{Title}`, and the formatting, links and references inside a
// block land on one `InlineSpan` vocabulary the same way.

syntax = "proto3";

package ai.pipestream.markup.v1;

option java_multiple_files = true;
option java_outer_classname = "MarkupTypesProto";
option java_package = "ai.pipestream.markup.v1";

// MarkupFormat names one input family this collector can map.
//
// The enum lists every format the contract knows; the set a given build
// actually maps is reported by `GetServiceInfoResponse.formats`, and asking
// for a format outside that set is `UNIMPLEMENTED`.
enum MarkupFormat {
  // In ParseOptions: sniff the format from the bytes. Never appears on
  // MarkupInfo or ParseStatus.
  MARKUP_FORMAT_UNSPECIFIED = 0;

  // CommonMark Markdown, with pipe tables and YAML front matter.
  MARKUP_FORMAT_MARKDOWN = 1;

  // HTML or XHTML, whole documents and fragments alike.
  MARKUP_FORMAT_HTML = 2;

  // AsciiDoc.
  MARKUP_FORMAT_ASCIIDOC = 3;

  // LaTeX source.
  MARKUP_FORMAT_LATEX = 4;

  // WebVTT subtitle and caption files.
  MARKUP_FORMAT_VTT = 5;

  // Box Notes, the JSON note format exported by Box.
  MARKUP_FORMAT_BOXNOTE = 6;

  // A DoclingDocument serialized as JSON, re-ingested losslessly into the
  // Document plane.
  MARKUP_FORMAT_DOCLING_JSON = 7;

  // reStructuredText source. Named so `.rst` bytes resolve to themselves
  // rather than being mistaken for Markdown by the structure heuristic; a
  // build without the fold refuses them with `UNIMPLEMENTED` naming this
  // format.
  MARKUP_FORMAT_RST = 8;
}

// IntRange is a half-open `[start, end)` range of Unicode scalar values.
//
// Offsets count code points, not bytes, and index the text the same event
// carries after flattening, so a consumer slices the string it was already
// given without re-deriving anything.
message IntRange {
  // First code point of the range.
  uint32 start = 1;

  // One past the last code point of the range.
  uint32 end = 2;
}

// SpanStyle names one rendering signal a run of text carries.
//
// A run may carry several (bold and code at once), which is why the field
// holding these is repeated rather than an enum-valued scalar.
enum SpanStyle {
  // Never sent. Present because proto3 requires a zero value.
  SPAN_STYLE_UNSPECIFIED = 0;

  // Bold: Markdown `**`, HTML `b`/`strong`, LaTeX `\textbf`.
  SPAN_STYLE_BOLD = 1;

  // Italic: Markdown `*`, HTML `i`/`em`, LaTeX `\textit`/`\emph`.
  SPAN_STYLE_ITALIC = 2;

  // Underline: HTML `u`, LaTeX `\underline`.
  SPAN_STYLE_UNDERLINE = 3;

  // Struck through: Markdown `~~`, HTML `s`/`del`/`strike`.
  SPAN_STYLE_STRIKETHROUGH = 4;

  // An inline code run: Markdown backticks, HTML `code`, LaTeX `\texttt`.
  SPAN_STYLE_CODE = 5;

  // Raised: Markdown `^`, HTML `sup`.
  SPAN_STYLE_SUPERSCRIPT = 6;

  // Lowered: Markdown `~`, HTML `sub`.
  SPAN_STYLE_SUBSCRIPT = 7;

  // Highlighted: HTML `mark`.
  SPAN_STYLE_MARK = 8;

  // Small capitals: LaTeX `\textsc`.
  SPAN_STYLE_SMALL_CAPS = 9;

  // An inline math run. `InlineSpan.raw` carries the source notation.
  SPAN_STYLE_MATH = 10;

  // Inserted text: HTML `ins`.
  SPAN_STYLE_INSERTION = 11;

  // An abbreviation whose expansion is in `InlineSpan.raw`: HTML `abbr`.
  SPAN_STYLE_ABBREVIATION = 12;

  // A quoted run inside a larger text: HTML `q`.
  SPAN_STYLE_QUOTE = 13;

  // Set smaller than the surrounding text: HTML `small`. Distinct from
  // `SPAN_STYLE_SMALL_CAPS`, which is a letterform and not a size.
  SPAN_STYLE_SMALL = 14;
}

// ReferenceKind names what an `InlineSpan.reference` points at.
enum ReferenceKind {
  // The span carries no reference.
  REFERENCE_KIND_UNSPECIFIED = 0;

  // A footnote marker, pointing at the `BLOCK_LABEL_FOOTNOTE` body whose
  // `anchor_id` is the same key.
  REFERENCE_KIND_FOOTNOTE = 1;

  // A bibliographic citation: LaTeX `\cite` and its siblings.
  REFERENCE_KIND_CITATION = 2;

  // An internal cross-reference to a labelled block: LaTeX `\ref`, an
  // intra-document `#anchor` link.
  REFERENCE_KIND_CROSS_REF = 3;

  // A cross-reference to a numbered equation: LaTeX `\eqref`.
  REFERENCE_KIND_EQUATION_REF = 4;

  // A reference to a bibliography entry declared by `\bibitem`.
  REFERENCE_KIND_BIBLIOGRAPHY = 5;
}

// InlineSpan is one contiguous run of a block's text that carries something
// the flat string cannot say: emphasis, a link, or a reference.
//
// Spans are emitted in the order their runs start, they may nest and
// overlap (bold inside a link is two spans), and every offset is a code
// point into the text of the event that carries the span. A consumer that
// ignores this field reads exactly what it read before spans existed.
message InlineSpan {
  // The run this span covers, in code points into the enclosing text.
  // Always set, always within the text's length.
  IntRange range = 1;

  // Rendering signals the run carries. May be empty when the span exists
  // only for its link or its reference.
  repeated SpanStyle styles = 2;

  // Link target for a run the source linked, as written; never
  // dereferenced. Set for every in-prose link, not only for a block that is
  // entirely one link.
  optional string hyperlink = 3;

  // The link's title or tooltip text, when the source wrote one.
  optional string link_title = 4;

  // The anchor this run defines, when the source names one inside the text
  // (a LaTeX `\label`, an HTML `id` on an inline element).
  optional string anchor_id = 5;

  // The key this run points at: a footnote label, a citation key, a
  // cross-reference target.
  optional string reference = 6;

  // What `reference` points at. `REFERENCE_KIND_UNSPECIFIED` whenever
  // `reference` is unset.
  ReferenceKind reference_kind = 7;

  // The source notation behind the run, when flattening lost it: the TeX
  // of an inline formula, the expansion of an abbreviation.
  optional string raw = 8;

  // The run's own font family, as the source names it.
  optional string font_family = 9;

  // The run's own font size in points.
  optional double font_size_pt = 10;

  // The run's own text color as `#rrggbb`.
  optional string color = 11;

  // The run's own BCP 47 language tag, when it differs from the block's.
  optional string language = 12;

  // The source field code a generated run came from (a page number, a
  // date, a resolved cross-reference), so generated text stays
  // distinguishable from authored text.
  optional string field_code = 13;

  // The named character style the source puts on the run, as written: the
  // class list of a WebVTT `<c.loud.narrow>` or of any cue tag that carries
  // one, dots and all. A name, never a resolved rendering: this service has
  // no stylesheet and does not want one.
  optional string style_name = 14;

  // The interlinear annotation printed over the run: the reading inside a
  // WebVTT `<ruby>`'s `<rt>`. The base text stays in the enclosing text and
  // the reading rides here, so neither is interleaved into the other.
  optional string annotation = 15;
}

// AdmonitionKind names the callout a block is marked as.
enum AdmonitionKind {
  // The block is not an admonition.
  ADMONITION_KIND_UNSPECIFIED = 0;

  // AsciiDoc `NOTE:`, a GFM `[!NOTE]` alert.
  ADMONITION_KIND_NOTE = 1;

  // AsciiDoc `TIP:`, a GFM `[!TIP]` alert.
  ADMONITION_KIND_TIP = 2;

  // AsciiDoc `IMPORTANT:`, a GFM `[!IMPORTANT]` alert.
  ADMONITION_KIND_IMPORTANT = 3;

  // AsciiDoc `WARNING:`, a GFM `[!WARNING]` alert.
  ADMONITION_KIND_WARNING = 4;

  // AsciiDoc `CAUTION:`, a GFM `[!CAUTION]` alert.
  ADMONITION_KIND_CAUTION = 5;
}

// Alignment names how a table column or cell places its content. The
// horizontal members apply to `align`, the vertical ones to `valign`.
enum Alignment {
  // The source declares no alignment.
  ALIGNMENT_UNSPECIFIED = 0;

  // Horizontal: flush left (Markdown `:---`, AsciiDoc `<`, LaTeX `l`).
  ALIGNMENT_LEFT = 1;

  // Horizontal: centered (Markdown `:---:`, AsciiDoc `^`, LaTeX `c`).
  ALIGNMENT_CENTER = 2;

  // Horizontal: flush right (Markdown `---:`, AsciiDoc `>`, LaTeX `r`).
  ALIGNMENT_RIGHT = 3;

  // Horizontal: justified (LaTeX `p{width}`, HTML `align="justify"`).
  ALIGNMENT_JUSTIFY = 4;

  // Vertical: flush to the top of the cell (AsciiDoc `.<`).
  ALIGNMENT_TOP = 5;

  // Vertical: centered in the cell (AsciiDoc `.^`).
  ALIGNMENT_MIDDLE = 6;

  // Vertical: flush to the bottom of the cell (AsciiDoc `.>`).
  ALIGNMENT_BOTTOM = 7;
}

// ColumnSpec is one column's declared geometry, in column order.
message ColumnSpec {
  // Horizontal alignment the source declares for the column.
  Alignment align = 1;

  // Vertical alignment the source declares for the column.
  Alignment valign = 2;

  // The column's declared width, verbatim in the source's own units (`20%`,
  // `5cm`, `120`). Absent when the source declares none.
  optional string width = 3;
}

// FormatEvidence names the signal that resolved the format.
enum FormatEvidence {
  // Never sent. Present because proto3 requires a zero value.
  FORMAT_EVIDENCE_UNSPECIFIED = 0;

  // The request stated the format.
  FORMAT_EVIDENCE_REQUESTED = 1;

  // An unambiguous signature matched: the `WEBVTT` header, an HTML doctype
  // or `<html` root, a JSON payload whose `schema_name` is a
  // DoclingDocument's, a BoxNote's `atext` structure, or a LaTeX
  // `\documentclass` preamble.
  FORMAT_EVIDENCE_SIGNATURE = 2;

  // No signature matched and the bytes were classified by structure. Only
  // Markdown, AsciiDoc and reStructuredText are ever resolved this way, and
  // only when the request left the format unspecified.
  FORMAT_EVIDENCE_HEURISTIC = 3;
}

// CollectorSource is the provenance stamped on every emitted item.
message CollectorSource {
  // Always `markup` for this service.
  string collector = 1;

  // The fold that produced the item: `markdown`, `html`, `asciidoc`,
  // `latex`, `vtt`, `boxnote` or `docling-json`.
  optional string model = 2;

  // Version of this server, as reported by `GetServiceInfo`.
  optional string version = 3;

  // Producer confidence, 0.0 to 1.0. Unset here: a declarative markup
  // mapping is deterministic, so claiming a confidence would be noise.
  optional double confidence = 4;
}

// MarkupInfo is the resolved identity of the document, sent before any
// content event.
message MarkupInfo {
  // The format the rest of the stream is mapped with. Never
  // `MARKUP_FORMAT_UNSPECIFIED`.
  MarkupFormat format = 1;

  // How the format was decided, for debugging a surprising mapping.
  FormatEvidence evidence = 2;

  // Document title, when the format declares one in a position the parser
  // has already passed: an HTML `<title>`, a front-matter `title:` key, a
  // BoxNote title. Absent otherwise; a heading-derived title still arrives
  // as a `TextBlock` with `BLOCK_LABEL_TITLE`.
  optional string title = 3;

  // Document-level metadata the format declares about itself, keyed by the
  // source's own top-level names and shaped as the source shaped it:
  // Markdown YAML front matter arrives as its own tree; HTML `<meta>` tags
  // (under `meta.*` keys), AsciiDoc attribute entries, WebVTT header lines
  // and Docling JSON identity are naturally flat scalars. Empty when the
  // format carries none.
  map<string, MetaValue> metadata = 4;
}

// MetaValue is one metadata value, holding the shape the source declared.
//
// A scalar is verbatim text exactly as the author wrote it: a YAML
// `version: 1.10` arrives as the string "1.10". This type deliberately has
// no number arm — front-matter scalars are text, and a double would mangle
// versions and dates — which is why this is not `google.protobuf.Struct`.
// A YAML sequence is a list, a YAML mapping is a map, and nothing is ever
// JSON-encoded inside the wire.
message MetaValue {
  // The one shape this value has.
  oneof kind {
    // Verbatim scalar text, exactly as the source wrote it. A YAML null is
    // the empty string.
    string value = 1;

    // A sequence of values.
    MetaList list = 2;

    // A nested mapping.
    MetaMap map = 3;
  }
}

// MetaList is a sequence of metadata values, in source order.
message MetaList {
  // The sequence's items.
  repeated MetaValue items = 1;
}

// MetaMap is a nested mapping of metadata values.
message MetaMap {
  // The mapping's entries, keyed as the source spelled them.
  map<string, MetaValue> entries = 1;
}

// TaskState is whether a list item carries a checkbox, and whether it is
// ticked.
//
// The state is a fact about the item and not a refinement of its label,
// which is why it is its own field rather than a `role` spelling: a task
// item is still a list item, and a consumer that wants the checkbox should
// not have to match on a string.
enum TaskState {
  // The item carries no checkbox.
  TASK_STATE_UNSPECIFIED = 0;

  // An unticked checkbox: Markdown `- [ ]`, a BoxNote check-list entry the
  // author has not ticked.
  TASK_STATE_UNCHECKED = 1;

  // A ticked checkbox: Markdown `- [x]`, a ticked BoxNote check-list entry.
  TASK_STATE_CHECKED = 2;
}

// BlockLabel is the structural role of one text block.
enum BlockLabel {
  // Never sent. Present because proto3 requires a zero value.
  BLOCK_LABEL_UNSPECIFIED = 0;

  // The document's title.
  BLOCK_LABEL_TITLE = 1;

  // A heading below the title. `TextBlock.level` carries its depth.
  BLOCK_LABEL_SECTION_HEADER = 2;

  // A paragraph of running text.
  BLOCK_LABEL_PARAGRAPH = 3;

  // One item of a list. `TextBlock.enumerated`, `marker` and `list_depth`
  // describe the list it belongs to.
  BLOCK_LABEL_LIST_ITEM = 4;

  // A code block. `TextBlock.language` carries the declared language when
  // the source names one.
  BLOCK_LABEL_CODE = 5;

  // A display formula, carried as the source wrote it.
  BLOCK_LABEL_FORMULA = 6;

  // A caption attached to a table or image.
  BLOCK_LABEL_CAPTION = 7;

  // A block quotation. Nested quotation depth is not modelled; nested
  // quotes flatten into one block per paragraph.
  BLOCK_LABEL_QUOTE = 8;

  // A footnote or endnote body.
  BLOCK_LABEL_FOOTNOTE = 9;
}

// TextBlock is one unit of text, in document order.
message TextBlock {
  // Zero-based index of this item within the stream, counting every
  // `TextBlock`, `TableStart`, `ImageBlock` and `Cue`. Stable within one
  // parse only.
  uint64 index = 1;

  // Structural label.
  BlockLabel label = 2;

  // Format-specific refinement of `label`, an open vocabulary: `abstract`,
  // `admonition`, `definition-term`, `front-matter`. Empty when the label
  // says everything.
  string role = 3;

  // The block's text: inline markup flattened away, entity and escape
  // sequences decoded, runs of whitespace collapsed except inside
  // `BLOCK_LABEL_CODE` and `BLOCK_LABEL_FORMULA`, which keep their text
  // verbatim. A hard line break the source demands (a Markdown `\\` or
  // two-space break, an HTML `<br>`) survives the collapsing as a `\n`,
  // because the author asked for a break rather than for whitespace.
  // Never empty. What the flattening removed is described by `spans`,
  // whose ranges index this string.
  string text = 4;

  // Heading depth for `BLOCK_LABEL_SECTION_HEADER`, starting at 1. Absent
  // for every other label.
  optional uint32 level = 5;

  // For `BLOCK_LABEL_LIST_ITEM`: true when the list is numbered.
  bool enumerated = 6;

  // For `BLOCK_LABEL_LIST_ITEM`: the item's marker as written (`-`, `3.`,
  // `a)`). Absent when the source leaves numbering implicit.
  optional string marker = 7;

  // For `BLOCK_LABEL_LIST_ITEM`: nesting depth of the list, starting at 1
  // for a top-level list.
  optional uint32 list_depth = 8;

  // For `BLOCK_LABEL_CODE`: the language the source declares on the block,
  // verbatim (an info string, a `language-*` class, a listing attribute).
  // Absent when the source declares none.
  optional string language = 9;

  // Hyperlink target when the entire block is one link, which is a fact
  // about the block rather than about its runs. A link inside a larger
  // block is a `spans` entry carrying `hyperlink`, so no URL is lost
  // either way.
  optional string hyperlink = 10;

  // One-based line in the source where the block starts, when the parser
  // tracks lines. Markup is line-oriented, so this is the block's address
  // for diagnostics the way `path` is in an XML collector.
  optional uint32 source_line = 11;

  // Provenance, always set.
  CollectorSource source = 12;

  // Formatting, link and reference runs inside `text`, in start order.
  // Empty when the block is uniform prose, and empty for every block when
  // the request cleared `ParseOptions.emit_inline_spans`.
  repeated InlineSpan spans = 13;

  // The anchor this block declares, as the source names it: a Markdown
  // `{#id}` heading attribute, an HTML `id`, a LaTeX `\label`, a footnote
  // definition's own label, a `\bibitem` key. Absent when the source names
  // none.
  optional string anchor_id = 14;

  // The callout kind the source marks the block as. Never set for a block
  // the source did not mark.
  AdmonitionKind admonition = 15;

  // For `BLOCK_LABEL_LIST_ITEM`: the checkbox the source put on the item.
  // `TASK_STATE_UNSPECIFIED` for an item with none, which is every item of
  // an ordinary list.
  TaskState task_state = 16;

  // The source form behind `text`, when the text is a projection of markup
  // this build does not parse: the verbatim bytes of an HTML block inside a
  // Markdown document, whose tags were flattened away. Absent for a block
  // whose text is the source's own words.
  optional string raw = 18;

  // How deep inside a block quotation this block sat, starting at 1 for a
  // top-level quote. Absent for a block outside every quotation: a depth of
  // zero is not a quotation nested zero deep.
  //
  // Set on any block, not only on `BLOCK_LABEL_QUOTE`, because a quotation
  // contains whatever the author put in it: a list item inside a quote
  // carries the depth too. `BLOCK_LABEL_QUOTE` still says "this block is a
  // quoted paragraph"; this field says how deep it was.
  optional uint32 quote_depth = 17;
}

// TableStart opens a streamed table. Rows follow, then `TableEnd`.
message TableStart {
  // Stream index, in the same series as `TextBlock.index`.
  uint64 index = 1;

  // Identifier used by the `TableRow` and `TableEnd` events of this table.
  // Unique within one parse.
  string table_ref = 2;

  // Caption text, when the source carries one before the table body. A
  // caption that follows the body arrives as a `TextBlock` with
  // `BLOCK_LABEL_CAPTION` instead, because the table has already streamed
  // by then.
  optional string caption = 3;

  // One-based source line of the table's first row, when tracked.
  optional uint32 source_line = 4;

  // Provenance, always set.
  CollectorSource source = 5;

  // The column geometry the source declares, in column order: a Markdown
  // delimiter row, an HTML `<colgroup>`, a LaTeX column specification.
  // Empty when the source declares none; shorter than the widest row when
  // the source declares only some.
  repeated ColumnSpec columns = 6;

  // The anchor the source declares on the table itself, as it names it: the
  // `\label` of a LaTeX `table` float. Absent when the source names none.
  // A cross reference to a table points here, not at its caption.
  optional string anchor_id = 7;
}

// TableCell is one cell of a streamed table row.
message TableCell {
  // Zero-based column index, advanced by the column spans before it.
  uint32 column_index = 1;

  // Cell text, flattened the same way as `TextBlock.text`, with `spans`
  // describing what the flattening removed. Nested block structure inside
  // a cell flattens into this text; when the cell is rich the same
  // structure also rides on `blocks`. May be empty.
  string text = 2;

  // Columns this cell spans. At least 1; always 1 in formats without spans.
  uint32 column_span = 3;

  // Rows this cell spans. At least 1; always 1 in formats without spans.
  uint32 row_span = 4;

  // True when the source marks the cell as a header: a `th`, a cell in
  // `thead`, or a cell in a Markdown or AsciiDoc header row.
  bool is_header = 5;

  // Formatting, link and reference runs inside `text`, in start order.
  // Empty when the cell is uniform prose, and empty for every cell when the
  // request cleared `ParseOptions.emit_inline_spans`.
  repeated InlineSpan spans = 6;

  // Horizontal alignment the source declares on the cell itself, which
  // overrides the column's. `ALIGNMENT_UNSPECIFIED` when it declares none.
  Alignment align = 7;

  // Vertical alignment the source declares on the cell itself, which
  // overrides the column's. `ALIGNMENT_UNSPECIFIED` when it declares none.
  Alignment valign = 8;

  // The cell's structured content, present only when the cell is rich: it
  // holds nested block markup (a nested table, a list, a heading, a `pre`
  // with inline structure) or inline formatting a flat projection would
  // lose (`u`, `ins`, `sub`, `sup`). The same content still flattens into
  // `text`; this field is the structure beside the flattening, so a plain
  // cell never sets it. Only the anchor cell of a span carries blocks: the
  // positions a span covers are not cells and carry nothing.
  repeated CellBlock blocks = 9;
}

// CellBlock is one structured block inside a rich table cell: a text
// block, an image, or a nested table.
//
// No block events stream between `TableRow` and `TableEnd` — the stream's
// document order forbids them there — so a rich cell's structure rides on
// the cell itself. A block nested in a cell has no stream `index`: the
// cell carrying it is its position.
message CellBlock {
  // The one shape this block has.
  oneof kind {
    // A paragraph, list item, heading or code block of the cell, with its
    // runs.
    TextBlock text = 1;

    // An image the cell holds.
    ImageBlock image = 2;

    // A table nested inside the cell.
    CellTable table = 3;
  }
}

// CellTable is a table nested inside a table cell.
message CellTable {
  // The nested table's rows in row order, in the same shape a streamed
  // table's rows arrive. Their `table_ref` is empty: a nested table has no
  // stream identity of its own.
  repeated TableRow rows = 1;

  // The nested table's caption, when it declares one.
  optional string caption = 2;
}

// TableRow is one row of a table, emitted as soon as it is parsed.
message TableRow {
  // The table this row belongs to, matching `TableStart.table_ref`.
  string table_ref = 1;

  // Zero-based row index within the table.
  uint32 row_index = 2;

  // True when the row is a header row.
  bool is_header = 3;

  // The row's cells in column order. Never empty.
  repeated TableCell cells = 4;
}

// TableEnd closes a streamed table.
message TableEnd {
  // The table being closed, matching `TableStart.table_ref`.
  string table_ref = 1;

  // Number of `TableRow` events sent for this table.
  uint32 row_count = 2;

  // Widest row of the table, in columns after span expansion.
  uint32 column_count = 3;
}

// ImageBlock is one image reference, in document order.
//
// The collector is handed markup, not a container: image bytes are never on
// this wire, only the reference the source wrote.
message ImageBlock {
  // Stream index, in the same series as `TextBlock.index`.
  uint64 index = 1;

  // The reference as written: a URL, a relative path, or a `data:` URI.
  // Never dereferenced by this service.
  string src = 2;

  // Alternative text, empty when the source has none.
  string alt = 3;

  // Title or tooltip text, empty when the source has none.
  string title = 4;

  // One-based source line, when tracked.
  optional uint32 source_line = 5;

  // Provenance, always set.
  CollectorSource source = 6;

  // The anchor the source declares on the image itself, as it names it: the
  // `\label` of a LaTeX `figure` float. Absent when the source names none.
  // A cross reference to a figure points here, not at its caption.
  optional string anchor_id = 9;

  // The width the source declares for the image, verbatim in the source's
  // own units: an HTML `width="640"` or `width="50%"`, a LaTeX
  // `[width=0.8\textwidth]`. Absent when the source declares none. This is
  // what the *document* asks for, not what the image is: this service never
  // fetches an image and so never measures one.
  optional string width = 7;

  // The height the source declares, on the same terms as `width`.
  optional string height = 8;

  // The href of an `<a>` whose only content is this image: the link a
  // click on the picture would follow. Absent when the anchor wraps more
  // than the image — an `<a>` over image and text together is a link over
  // prose, and its URL rides on the text's runs instead.
  optional string hyperlink = 10;
}

// CueTiming is one karaoke segment of a cue: the run of the cue's text a
// `<00:00:01.000>` timestamp tag gives its own start time.
//
// A cue that carries no timestamp tag carries no `CueTiming` either; its
// timing is the cue's own `start_ms` / `end_ms` and repeating that once more
// would say nothing. A cue that carries one gets a segment for every run,
// the leading run included, so the segments tile the whole text.
message CueTiming {
  // The run this segment covers, in code points into `Cue.text`.
  IntRange range = 1;

  // When the segment starts, in milliseconds from the start of the media.
  uint64 start_ms = 2;

  // When the segment ends: the next segment's start, or the cue's own end
  // for the last one.
  uint64 end_ms = 3;
}

// Cue is one WebVTT cue: a timed span of caption or subtitle text.
message Cue {
  // Stream index, in the same series as `TextBlock.index`.
  uint64 index = 1;

  // The cue identifier line, when the cue has one.
  optional string cue_id = 2;

  // Cue start, in milliseconds from the start of the media.
  uint64 start_ms = 3;

  // Cue end, in milliseconds from the start of the media.
  uint64 end_ms = 4;

  // The speaker named by a `<v>` voice span, empty when the cue has none.
  string speaker = 5;

  // The cue payload with its tags flattened away, character entities
  // decoded, and lines joined with `\n`. What the flattening removed is
  // described by `spans` and `timings`, whose ranges index this string.
  string text = 6;

  // Provenance, always set.
  CollectorSource source = 7;

  // Formatting, class and language runs inside `text`, in start order: a
  // `<b>`, `<i>` or `<u>` leaves a style, a `<c.name>` leaves the class list
  // in `style_name`, and a `<lang xx>` leaves the tag in `language`. Empty
  // when the payload is unmarked, and empty for every cue when the request
  // cleared `ParseOptions.emit_inline_spans`.
  repeated InlineSpan spans = 8;

  // Karaoke segments of `text`, in start order, tiling the whole string.
  // Empty when the cue carries no timestamp tag.
  repeated CueTiming timings = 9;
}

// WarningCode names a condition that did not stop the parse.
enum WarningCode {
  // Never sent. Present because proto3 requires a zero value.
  WARNING_CODE_UNSPECIFIED = 0;

  // A construct with no mapping was encountered. Its text, when it had any,
  // was flattened into the enclosing block rather than dropped; the message
  // names the construct.
  WARNING_CODE_UNMAPPED_CONSTRUCT = 1;

  // Document metadata (front matter, `<meta>`, attribute entries) was
  // present but could not be interpreted, so `MarkupInfo.metadata` is
  // missing keys the source tried to declare.
  WARNING_CODE_METADATA = 2;

  // The source was structurally malformed — mis-nested tags, an unclosed
  // block, a cue whose end precedes its start — and the parser repaired it
  // the way the format's error-handling rules say to.
  WARNING_CODE_MALFORMED_STRUCTURE = 3;

  // Bytes were not valid UTF-8 and malformed sequences were replaced with
  // U+FFFD.
  WARNING_CODE_ENCODING_SUBSTITUTION = 4;

  // Raw embedded HTML inside a non-HTML format was flattened to its text
  // rather than parsed.
  WARNING_CODE_EMBEDDED_HTML_FLATTENED = 5;
}

// ParseWarning is one non-fatal finding, carried on the trailer.
message ParseWarning {
  // What kind of finding this is.
  WarningCode code = 1;

  // Human-readable detail, safe to log.
  string message = 2;

  // How many times this exact finding occurred. Findings are aggregated per
  // (code, message) pair so a document with ten thousand instances produces
  // one warning, not ten thousand.
  uint64 count = 3;
}

// ParseCounts is the tally of what the stream carried.
message ParseCounts {
  // `TextBlock` events sent.
  uint64 text_blocks = 1;

  // `TableStart` events sent, which is the number of tables.
  uint64 tables = 2;

  // `TableRow` events sent across all tables.
  uint64 table_rows = 3;

  // `ImageBlock` events sent.
  uint64 images = 4;

  // `Cue` events sent.
  uint64 cues = 5;
}

// ParseStatus is the trailer of a successful parse: the last event of the
// stream, never the payload.
//
// A parse that fails does not send `ParseStatus`; it ends the stream with a
// gRPC status instead (`INVALID_ARGUMENT` for input the format's own error
// rules cannot repair, `RESOURCE_EXHAUSTED` past the byte cap,
// `UNIMPLEMENTED` for a format this build does not map, `INTERNAL` for a
// parser fault).
message ParseStatus {
  // The format the document was mapped with. Never
  // `MARKUP_FORMAT_UNSPECIFIED`.
  MarkupFormat format = 1;

  // What the stream carried.
  ParseCounts counts = 2;

  // Non-fatal findings, aggregated. May be empty.
  repeated ParseWarning warnings = 3;

  // Bytes consumed from the request stream.
  uint64 bytes_consumed = 4;

  // Wall-clock milliseconds from the first request frame to this trailer.
  uint64 elapsed_millis = 5;
}
